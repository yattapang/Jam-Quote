# What the secret scanner is allowed to ignore, and why each one is safe.
#
# THIS FILE IS A LIABILITY IF IT IS WRITTEN CARELESSLY. Every entry is a place a real
# credential could hide from the scan, so the rules are: name the exact thing, never a
# directory and never a rule id, and state a reason somebody can check by reading one
# line of code. An allowlist saying "test files" would exempt every credential anyone
# ever pastes into a test, which is the most common place they get pasted.
#
# The first scan over the full history (427 commits) found three matches. All three are
# false positives, each verified by reading the line rather than trusting its name.
# Nothing was deleted to make the scanner quiet and no rule was weakened.
#
# ## Why the singular `[allowlist]`
#
# The first version of this file used a top-level `[[allowlists]]` array. gitleaks
# 8.24.3 ignored it **silently** — 428 commits scanned, same three findings, no warning
# that the config had been read and discarded. The singular `[allowlist]` is the form v8
# has always honoured. A tool quietly ignoring its own configuration is the same class of
# problem as one quietly scanning a single commit, and it is why the workflow now passes
# `--config` explicitly and why this comment exists rather than a silent fix.

[extend]
# Start from the full default rule set. This file only ever adds exemptions; it never
# removes a detection.
useDefault = true

[allowlist]
description = "Three verified false positives from the first full-history scan, 2026-09-24"

# A regex here is matched against the extracted SECRET by default, and what a given rule
# chooses to extract is not something we should have to guess at. The whole line is what
# was actually read and verified, so the whole line is what is matched.
regexTarget = "line"

regexes = [
  # 1 & 2. new-app/api/src/core/auth/secret-box.test.ts:30 and totp.test.ts:129.
  #
  # Base32 for the ASCII string "12345678901234567890" — the seed published in RFC 6238
  # Appendix B beside the six code values our TOTP implementation is checked against. It
  # is in a public standards document and protects nothing.
  #
  # It also cannot be swapped for a random fixture without destroying the only
  # meaningful correctness check on that code: the other implementation of the protocol
  # is an authenticator app we do not control, so agreeing with our own generator would
  # prove nothing (ADR 0021). Exempt the published constant; do not weaken the test.
  #
  # Matched by regex rather than pinned to a commit because those files will legitimately
  # change and the seed must keep working when they do.
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',

  # 3. apps/api/.env.example:9 — `WIPAY_API_KEY=""`, an empty value in the checked-in
  # template that tells a developer which variables to set locally. The match spanned
  # lines 9-10 and caught the adjacent `WIPAY_ENVIRONMENT="sandbox"`. I read both lines
  # at the commit that introduced them and as they stand today; there is no credential.
  #
  # THE EMPTY QUOTES ARE THE POINT, and this is deliberately narrower than the first
  # attempt, which pinned the whole historical commit. This pattern matches only an
  # explicitly EMPTY value: `WIPAY_API_KEY="sk_live_..."` does not match it and would
  # still be reported. Exempting the path, or the commit, would have covered a real key
  # pasted into that file later "just to show the format".
  '''WIPAY_API_KEY=""''',
]
