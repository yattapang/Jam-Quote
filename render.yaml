# Render Blueprint for the JamQuote API.
# https://render.com/docs/blueprint-spec
#
# Usage: in the Render dashboard, "New +" -> "Blueprint", point it at this
# repo. Render reads this file and provisions the service below. DATABASE_URL
# is sync:false (set it manually in the dashboard from your Neon connection
# string) -- never commit a real connection string.
services:
  - type: web
    name: jamquote-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run -w @jamquote/api prisma:generate && npx turbo run build --filter=@jamquote/api
    # Apply pending Prisma migrations, THEN start. This lives in the start command
    # (not preDeployCommand) on purpose: Render's pre-deploy hook is a PAID-plan
    # feature and is silently ignored on the free tier, so migrations were never
    # actually being applied — the DB drifted behind the deployed code. `migrate
    # deploy` is idempotent (a no-op when nothing is pending), so running it on
    # every boot is safe; if a migration fails the service won't start, surfacing
    # the problem loudly instead of drifting silently. Needs DATABASE_URL set.
    startCommand: npm run -w @jamquote/api prisma:migrate:deploy && node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      # REQUIRED. Migrations run over this instead of DATABASE_URL — see
      # `directUrl` in schema.prisma. It must be the Neon host WITHOUT
      # `-pooler`: through the pooler, Prisma's session-level advisory lock is
      # recycled onto an application connection and never released, stranding
      # a fresh lock every boot until `migrate deploy` times out on P1002 and
      # the service never starts.
      #
      # Prisma fails schema validation when it is unset rather than falling
      # back to the pooled URL — deliberately, since a silent fallback would
      # reintroduce the bug invisibly. So a new deploy MUST set this.
      - key: DIRECT_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # REQUIRED: the API refuses to boot in production without this (auth.module
      # resolveJwtSecret). Set a long random value in the Render dashboard before
      # the first deploy that includes auth, or the service will crash on start.
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
