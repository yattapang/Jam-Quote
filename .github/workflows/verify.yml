# Typecheck, lint and test on every push and pull request.
#
# ## Why this exists
#
# It didn't, until now. The repo had 628 API tests, 453 web tests, 269 core tests,
# source-scanning guards for tenancy and disclosure — and the only workflow was a
# keep-warm ping. **Nothing gated anything.** A security review put it plainly:
# the reason a guard could be satisfied by an import line and nobody noticed is
# that no automated run had to agree before code shipped.
#
# `apps/api` lint was also ungated and had accumulated one error and five
# warnings, two of which were themselves review findings — a dead
# `resolveWebBase` and two recomputed-then-discarded reads in the billing sweep.
# Warnings that fail nothing become a list nobody reads.
#
# ## What it does NOT do
#
# It does not run `build`. `next build` fetches fonts from Google at build time
# and cannot complete on every network; Vercel builds the web app on deploy and is
# the honest gate for that. Adding it here would make a red X the normal state,
# which is worse than not checking.
#
# It does not deploy. Render and Vercel own that, from their own triggers.
#
# The `scan` job checks dependencies and looks for committed secrets across the whole
# history. It does NOT produce an SBOM, which the service register records as owed and
# which should land beside these two. Its dependency audit is a WARNING, not a gate,
# and the step itself records why and when that should change.
#
# ## Concurrency
#
# A new push to the same ref cancels the previous run. Two runs of the same branch
# tell you nothing extra and the free minutes are finite.
name: Verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The existing application lives in original-app/ (ADR 0010) and is its
    # own npm-workspace root, so every step below runs from there. When
    # new-app/ gains its own gate it becomes a second job, not a change here.
    defaults:
      run:
        working-directory: original-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: original-app/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the lockfile
      # says, so a run cannot pass against different dependencies than a colleague
      # has locally.
      - name: Install
        run: npm ci

      # The API tests import the generated Prisma client, and some replay
      # migrations against an in-process Postgres (PGlite). Neither needs a live
      # database, but both need the client to exist.
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # Each step runs even if an earlier one failed, so one push tells you
      # everything that is wrong rather than only the first thing.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

  # ---------------------------------------------------------------------------
  # new-app is a separate workspace root (ADR 0010), so it is a separate job
  # rather than a step: it has its own lockfile, its own dependencies, and a
  # failure in one application should not hide the state of the other.
  #
  # It gates from its first commit on purpose. The Phase 0 audit's blunt finding
  # was that the previous application had guards nothing ran, so a guard could be
  # satisfied by an import line and nobody noticed. A guard that does not gate is
  # a comment.
  # ---------------------------------------------------------------------------
  verify-new-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: new-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the contract generator runs TypeScript directly via
          # --experimental-strip-types, which needs 22.6+.
          node-version: 22
          cache: npm
          cache-dependency-path: new-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The database and tenancy tests replay the real migrations against PGlite,
      # which needs no service container: it is Postgres compiled to WebAssembly,
      # in process.
      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      # Proves the checked-in wire contract still matches the API's @wire types.
      # Regenerating here rather than trusting the committed file is the point:
      # drift becomes a red run instead of a client compiling against a shape the
      # server no longer sends.
      - name: Contract is not stale
        if: ${{ !cancelled() }}
        run: npm run contract:generate && git diff --exit-code -- packages/contract/src/generated

      # The public site IS built here, unlike in original-app, where `next build` was excluded
      # because it fetched fonts from Google at build time and could not complete on every
      # network. This site loads no third-party host at all (Rule 20), so the build is
      # self-contained - and it earned its place immediately: a module-resolution error that
      # both typecheck and the unit tests passed was caught only by building.
      - name: Build the site
        if: ${{ !cancelled() }}
        run: npm run build -w @pryvis/web

  # ---------------------------------------------------------------------------
  # scan: the class of problem the gate could not see at all
  #
  # Rule 17 named this as a stated weakness for as long as this workflow has
  # existed: no dependency-vulnerability check and no secret scan. Everything else
  # here asks "does our code do what we think". Neither of those questions is about
  # our code, which is why no amount of typechecking, testing or planting defects
  # was ever going to surface them.
  #
  # A SEPARATE JOB, not steps bolted onto the two above, for two reasons: it spans
  # the whole repository rather than one workspace root, and a red advisory must not
  # read as "the tests broke".
  # ---------------------------------------------------------------------------
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because a secret removed in a later commit is still a
          # leaked secret: whoever cloned the repo before the fix has it, and the
          # working tree alone would show nothing.
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # Committed secrets
      #
      # GitHub's own secret scanning is free on public repositories and depends on
      # the plan for private ones, so this runs regardless of what that setting
      # turns out to be - a control whose presence depends on a dashboard checkbox
      # nobody can see from the repo is not a control we can reason about (Rule 5).
      #
      # THE BINARY, NOT THE ACTION, AND THE REASON IS WORTH READING.
      #
      # The first version of this job used gitleaks/gitleaks-action@v2. Its own log
      # printed the command it actually ran:
      #
      #   gitleaks detect --redact --exit-code=2 --log-opts=-1
      #
      # `--log-opts=-1` is `git log -1`: THE MOST RECENT COMMIT ONLY. So a green
      # "No leaks detected" meant one commit was clean, while this file's comment and
      # the pull request that introduced it both claimed the whole history had been
      # scanned. `fetch-depth: 0` dutifully fetched a history that nothing then
      # looked at. A control that reports more coverage than it has is worse than no
      # control, because it stops anybody asking the question.
      #
      # `gitleaks git .` with no `--log-opts` scans every commit. Pinned by version,
      # so the scope cannot change underneath us the way it just did, and `--redact`
      # so a finding cannot print the secret into a public build log and leak it a
      # second time in the course of reporting it.
      #
      # BLOCKING from the first run, unlike the audit below. A committed credential
      # is not a backlog item: it is valid until it is rotated, and every minute it
      # sits on a green build is a minute somebody could be using it.
      - name: No committed secrets, over the whole history
        run: |
          set -euo pipefail
          version=8.24.3
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz gitleaks
          ./gitleaks version
          # --config is passed explicitly rather than relying on the implicit
          # `.gitleaks.toml` lookup: the first attempt at an allowlist silently had no
          # effect, and a scanner quietly ignoring its own exemptions is the same class
          # of problem as one quietly scanning a single commit.
          #
          # No --log-opts, so this is every commit rather than the tip.
          ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------------------------------------------------------------
      # Known vulnerabilities in what we install
      #
      # Both workspace roots, because they have separate lockfiles and a fix in one
      # says nothing about the other (ADR 0010).
      #
      # NON-BLOCKING ON PURPOSE, and this is the part to revisit rather than leave
      # forever. A transitive advisory with no published fix would otherwise redden
      # every pull request from the day this lands, and a gate that is red for
      # reasons nobody can act on is a gate people learn to ignore — the same
      # failure as the ungated lint warnings described at the top of this file.
      #
      # `continue-on-error` rather than `|| true` so the run is annotated as a
      # warning instead of silently passing: the finding still has to be looked at,
      # it just does not block. TURN THIS OFF once the first pass is clean, and
      # record the date in the service register when you do.
      - name: Audit original-app dependencies
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: original-app
        run: npm audit --audit-level=high

      - name: Audit new-app dependencies
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: new-app
        run: npm audit --audit-level=high
